name: Debug Build (no signing needed)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: '[diag] can this token even post a commit comment at all?'
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
          -d '{"body":"connectivity test - safe to ignore/delete"}')
        echo "http_status=$STATUS" >> "$GITHUB_OUTPUT" 2>/dev/null || true
        test "$STATUS" = "201"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun into app module
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        echo "CURRENT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
        popd

    - name: Download prebuilt libv2ray.aar (real Xray-core binding)
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: '[diag] is core-splashscreen actually in the resolved classpath?'
      continue-on-error: true
      working-directory: ${{ github.workspace }}/V2rayNG
      run: |
        chmod 755 gradlew
        ./gradlew :app:dependencies --configuration fdroidDebugRuntimeClasspath 2>&1 | grep -i splashscreen > /tmp/splash_dep.txt || true
        cat /tmp/splash_dep.txt
        test -s /tmp/splash_dep.txt

    - name: '[diag] is core-splashscreen actually on the resolved classpath?'
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        chmod 755 gradlew
        ./gradlew :app:dependencies --configuration fdroidDebugRuntimeClasspath > /tmp/deps.txt 2>&1
        grep -i splashscreen /tmp/deps.txt > /tmp/splash_deps.txt || echo "NOT FOUND in dependency tree" > /tmp/splash_deps.txt
        grep -i "kotlin_module_name\|kotlinOptions\|jvmTarget" /tmp/deps.txt | head -5 >> /tmp/splash_deps.txt || true
        {
          echo '### core-splashscreen dependency-tree check'
          echo '```'
          cat /tmp/splash_deps.txt
          echo '```'
        } > /tmp/error_comment.txt
        set -e
        STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
          -d "$(python3 -c "import json; print(json.dumps({'body': open('/tmp/error_comment.txt').read()}))")")
        echo "post status: $STATUS"

    - name: Build debug APK
      run: |
        set -o pipefail
        cd ${{ github.workspace }}/V2rayNG
        chmod 755 gradlew
        ./gradlew assembleFdroidDebug assemblePlaystoreDebug --stacktrace 2>&1 | tee /tmp/gradle_output.log
        exit "${PIPESTATUS[0]}"

    - name: '[diag] fdroid apk dir exists?'
      continue-on-error: true
      run: test -d ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid

    - name: '[diag] fdroid/debug dir exists?'
      continue-on-error: true
      run: test -d ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug

    - name: '[diag] any apk anywhere under app/build?'
      continue-on-error: true
      run: test -n "$(find ${{ github.workspace }}/V2rayNG/app/build -iname '*.apk' 2>/dev/null)"

    - name: '[diag] any apk anywhere under whole workspace?'
      continue-on-error: true
      run: test -n "$(find ${{ github.workspace }} -iname '*.apk' 2>/dev/null)"

    - name: '[diag] outputs dir exists at all?'
      continue-on-error: true
      run: test -d ${{ github.workspace }}/V2rayNG/app/build/outputs

    - name: Write output-tree diagnostic (always, cheap, can't fail)
      if: always()
      run: |
        find ${{ github.workspace }}/V2rayNG -iname "*.apk" > /tmp/apk_find.txt 2>&1
        echo "---" >> /tmp/apk_find.txt
        ls -laR ${{ github.workspace }}/V2rayNG/app/build/outputs >> /tmp/apk_find.txt 2>&1

    - name: Upload diagnostic text (tests whether artifact downloads are reachable at all)
      uses: actions/upload-artifact@v7
      with:
        name: diagnostic
        path: /tmp/apk_find.txt
        if-no-files-found: warn

    - name: Report compile errors as a commit comment (my sandbox can't reach Azure blob log storage, only api.github.com)
      if: failure()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set +e
        {
          echo '### Debug build failed — relevant output'
          echo '```'
          MATCHED=$(grep -B2 -A40 -iE "^e: |error:|FAILURE:|What went wrong" /tmp/gradle_output.log 2>/dev/null)
          if [ -n "$MATCHED" ]; then
            echo "$MATCHED" | head -c 60000
          else
            echo '(no error/FAILURE pattern matched — last 150 lines of raw output instead)'
            tail -150 /tmp/gradle_output.log | head -c 60000
          fi
          echo '```'
        } > /tmp/error_comment.txt
        set -e
        STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
          -d "$(python3 -c "import json; print(json.dumps({'body': open('/tmp/error_comment.txt').read()}))")")
        echo "post status: $STATUS"
        test "$STATUS" = "201"

    - name: Locate the built APK(s) precisely
      id: find_apk
      run: |
        FIRST=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs -iname "*.apk" | sort | head -1)
        echo "using: $FIRST"
        echo "path=$FIRST" >> "$GITHUB_OUTPUT"

    - name: '[diag] does the interpolated output path actually exist?'
      continue-on-error: true
      run: |
        test -f "${{ steps.find_apk.outputs.path }}"

    - name: '[diag] enough disk space left on the main volume?'
      continue-on-error: true
      run: test "$(df --output=avail / | tail -1)" -gt 2000000

    - name: Upload debug APKs
      uses: actions/upload-artifact@v7
      with:
        name: debug-apks
        path: ${{ steps.find_apk.outputs.path }}
        if-no-files-found: warn

    - name: Publish to a stable "debug-latest" GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        APK_PATH: ${{ steps.find_apk.outputs.path }}
      run: |
        set +e
        # Delete any previous "debug-latest" release + tag so we always have exactly one, current, stable link.
        REL_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/releases/tags/debug-latest" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))")
        if [ -n "$REL_ID" ]; then
          curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/$REL_ID"
        fi
        curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/git/refs/tags/debug-latest"

        set -e
        CREATE_RESP=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/releases" \
          -d "$(python3 -c "import json; print(json.dumps({'tag_name':'debug-latest','target_commitish':'$SHA','name':'ALONE VPN — latest debug build','body':'Auto-published by the debug-build workflow on every successful compile. Debug-signed, for install/testing only. Commit: $SHA','prerelease':True,'draft':False}))")")
        UPLOAD_URL=$(echo "$CREATE_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
        echo "upload_url: $UPLOAD_URL"
        curl -s -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary "@$APK_PATH" \
          "$UPLOAD_URL?name=alone-vpn-debug.apk"
